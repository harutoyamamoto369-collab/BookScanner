<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BookScanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<link rel="manifest" href="manifest.json">

<style>

body {
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    margin:0;
    padding:20px;
}

.container {
    max-width:500px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
}

h1 {
    text-align:center;
}

button {
    width:100%;
    padding:15px;
    margin-top:10px;
    font-size:18px;
    border:none;
    border-radius:10px;
}

.scan {
    background:#2196F3;
    color:white;
}

.save {
    background:#4CAF50;
    color:white;
}

input, select {

    width:100%;
    padding:12px;
    margin-top:8px;
    font-size:16px;

}

.book {

    background:#eee;
    margin-top:15px;
    padding:10px;
    border-radius:10px;

}

</style>

</head>


<body>


<div class="container">


<h1>📦 ResellScanner</h1>


<button class="scan" onclick="startScanner()">
📷 Barcode scannen
</button>

<button class="scan" onclick="startPhotoAI()">
📸 Objekt fotografieren & suchen
</button>


<div id="reader" style="width:300px;margin-top:20px;"></div>

<input 
type="file" 
id="photoInput" 
accept="image/*" 
capture="environment" 
style="display:none"
onchange="analyzePhoto(this)"
>

<div class="book" id="aiResult">

<h3>🔎 Bildersuche</h3>

<p>
<b>Objekt:</b>
<span id="aiObject">-</span>
</p>

<p>
<b>Wert geschätzt:</b>
<span id="aiValue">-</span>
</p>

<p>
<b>Maximal ankaufen:</b>
<span id="aiBuy">-</span>
</p>

<p>
<b>Empfehlung:</b>
<span id="aiAdvice">-</span>
</p>

<button onclick="openGoogleLens()">
🔎 Mit Google Lens suchen
</button>

</div>



<label>ISBN:</label>
<input id="isbn" placeholder="ISBN">

<label>Kategorie:</label>

<select id="category">

<option>Buch</option>
<option>Videospiel</option>
<option>DVD / Blu-ray</option>
<option>CD</option>
<option>Schallplatte</option>

</select>


<label>Titel:</label>
<input id="title" placeholder="Buchtitel">


<label>Autor:</label>
<input id="author" placeholder="Autor">

<label>Plattform:</label>
<input id="platform" placeholder="PS4, PS5, Switch, Xbox...">


<label>Hersteller / Publisher:</label>
<input id="publisher" placeholder="Verlag">


<label>Erscheinungsjahr:</label>
<input id="year" placeholder="Jahr">


<img id="cover" style="max-width:150px;margin-top:15px;">


<label>Zustand:</label>

<select id="condition">

<option>Sehr gut</option>
<option>Gut</option>
<option>Akzeptabel</option>

</select>



<label>💰 Einkaufspreis:</label>
<input id="buyPriceInput" placeholder="z.B. 2.00 €">


<label>🏷 Verkaufspreis:</label>
<input id="price" placeholder="z.B. 12.99 €">


<label>📦 Lagerplatz:</label>
<input id="place" placeholder="z.B. Kiste A1">


<label>📝 Notiz:</label>
<input id="note" placeholder="z.B. Flohmarkt Fund">

<h2>📊 Marktanalyse</h2>

<div class="book">

<p>
<b>Status:</b>
<span id="marketStatus">Bereit</span>
</p>

<p>
<b>Booklooker:</b>
<span id="booklookerPrice">-</span>
</p>

<p>
<b>eBay:</b>
<span id="ebayPrice">-</span>
</p>

<p>
<b>Empfohlener Ankauf:</b>
<span id="buyPrice">-</span>
</p>

<br>

<button onclick="openBooklooker()">
📚 Booklooker Angebote
</button>

<button onclick="openEbayActive()">
🛒 eBay aktuelle Angebote
</button>

<button onclick="openEbayCompleted()">
📋 eBay beendete Angebote
</button>

<button onclick="openEbaySold()">
💰 eBay verkaufte Artikel
</button>

</div>



<button class="save" onclick="saveBook()">
💾 Buch speichern
</button>



<h2>Meine Bücher</h2>

<button onclick="openBooklooker()">
📚 Bei Booklooker suchen
</button>

<div id="books"></div>


</div>



<script>


function startScanner(){

let scanner = new Html5Qrcode("reader");


scanner.start(
{ facingMode: { exact: "environment" } },
{
fps: 10,
qrbox: 250
},

(decodedText)=>{

document.getElementById("isbn").value = decodedText;

scanner.stop();

detectCategory(decodedText);

getBookData(decodedText);

analyzeMarket(decodedText);

},

(errorMessage)=>{

}

)

.catch((err)=>{

alert("Kamera Fehler: " + err);

});


}





async function getBookData(isbn){

isbn = isbn.replace(/[^0-9X]/gi,"");

try {

let googleResponse = await fetch(
"https://www.googleapis.com/books/v1/volumes?q=isbn:" + isbn
);

let googleData = await googleResponse.json();


if(googleData.items && googleData.items.length > 0){

let book = googleData.items[0].volumeInfo;

console.log(book);

document.getElementById("title").value =
book.title || "";


if(book.authors){

document.getElementById("author").value =
book.authors.join(", ");

}
else{

document.getElementById("author").value =
"Autor unbekannt";

}


// NEU: Verlag

document.getElementById("publisher").value =
book.publisher || "Nicht gefunden";


document.getElementById("year").value =
book.publishedDate || "Nicht gefunden";


// NEU: Cover

if(book.imageLinks){

document.getElementById("cover").src =
book.imageLinks.thumbnail;

}
else {

document.getElementById("cover").alt =
"Kein Cover verfügbar";

}

// Zusätzliche Daten von Open Library holen

try {

let openResponse = await fetch(
"https://openlibrary.org/isbn/" + isbn + ".json"
);

let openData = await openResponse.json();


// Verlag ergänzen falls leer

if(
document.getElementById("publisher").value === "Nicht gefunden"
&& openData.publishers
){

document.getElementById("publisher").value =
openData.publishers[0];

}


// Jahr ergänzen falls leer

if(
document.getElementById("year").value === "Nicht gefunden"
&& openData.publish_date
){

document.getElementById("year").value =
openData.publish_date;

}


// Cover von Open Library

if(!book.imageLinks){

document.getElementById("cover").src =
"https://covers.openlibrary.org/b/isbn/" + isbn + "-M.jpg";

}


}
catch(e){

console.log("Open Library keine Zusatzdaten");

}

alert("Buch gefunden: " + book.title);

return;

}


// zweite Suche

let openResponse = await fetch(
"https://openlibrary.org/isbn/" + isbn + ".json"
);


let openData = await openResponse.json();


if(openData.title){

document.getElementById("title").value =
openData.title;


// Autor holen

if(openData.authors && openData.authors.length > 0){

let authorResponse = await fetch(
"https://openlibrary.org" + openData.authors[0].key + ".json"
);

let authorData = await authorResponse.json();


document.getElementById("author").value =
authorData.name || "";

}


alert("Buch gefunden: " + openData.title);

}

else {

searchGame(isbn);

}


}

catch(error){

alert("Fehler bei der Suche");

}

}



async function analyzeMarket(isbn){

document.getElementById("marketStatus").innerHTML =
"🔎 Suche Marktpreise...";

document.getElementById("booklookerPrice").innerHTML =
"Wird gesucht...";

document.getElementById("ebayPrice").innerHTML =
"Wird gesucht...";

document.getElementById("buyPrice").innerHTML =
"Berechnung folgt...";


}


function getISBN(){

return document.getElementById("isbn").value;

}



function openBooklooker(){

let isbn = getISBN();

if(!isbn){

alert("Bitte erst Buch scannen!");

return;

}


window.open(
"https://www.booklooker.de/B%C3%BCcher/Angebote/fastSearch?isbn=" + isbn,
"_blank"
);

}



function openEbayActive(){

let isbn = getISBN();

if(!isbn){

alert("Bitte erst Buch scannen!");

return;

}


let url =
"https://www.ebay.de/sch/i.html?_nkw=" 
+ isbn +
"&LH_ItemCondition=3000";


window.open(url,"_blank");

}



function openEbaySold(){

let isbn = getISBN();

if(!isbn){

alert("Bitte erst Buch scannen!");

return;

}


let url =
"https://www.ebay.de/sch/i.html?_nkw="
+ isbn +
"&LH_Sold=1&LH_Complete=1";


window.open(url,"_blank");

}

function detectCategory(code){

let category = document.getElementById("category");


if(code.startsWith("978") || code.startsWith("979")){

category.value = "Buch";

}

else if(code.length >= 12){

category.value = "Videospiel";

}

}

async function searchGame(code){

try {

let response = await fetch(
"https://api.rawg.io/api/games?search=" + code
);


let data = await response.json();


if(data.results && data.results.length > 0){


let game = data.results[0];


document.getElementById("title").value =
game.name || "";


document.getElementById("year").value =
game.released || "";


document.getElementById("platform").value =
game.platforms ?
game.platforms.map(p => p.platform.name).join(", ")
:
"";


document.getElementById("publisher").value =
game.publishers ?
game.publishers.map(p => p.name).join(", ")
:
"";


if(game.background_image){

document.getElementById("cover").src =
game.background_image;

}


alert("Spiel gefunden: " + game.name);


}

else {

alert("Kein Spiel gefunden");

}


}

catch(error){

console.log(error);

alert("Fehler bei Spielsuche");

}


}

function openEbayCompleted(){

let code = getISBN();

if(!code){

alert("Bitte erst Barcode scannen!");

return;

}


let url =
"https://www.ebay.de/sch/i.html?_nkw="
+ code +
"&LH_Complete=1";


window.open(url,"_blank");

}

function startPhotoAI(){

document.getElementById("photoInput").click();

}



let selectedPhoto = null;


function analyzePhoto(input){

let file = input.files[0];

if(!file){

return;

}


selectedPhoto = file;


document.getElementById("aiObject").innerHTML =
"Foto gespeichert";


document.getElementById("aiValue").innerHTML =
"Bereit für Google Lens";


document.getElementById("aiBuy").innerHTML =
"-";


document.getElementById("aiAdvice").innerHTML =
"Drücke den Google Lens Button";


}



function openGoogleLens(){

if(!selectedPhoto){

alert("Bitte zuerst ein Foto machen");

return;

}


window.open(
"https://lens.google.com/",
"_blank"
);


}

function saveBook(){


let book = {


isbn:
document.getElementById("isbn").value,


title:
document.getElementById("title").value,


author:
document.getElementById("author").value,


condition:
document.getElementById("condition").value,


buyPrice:
document.getElementById("buyPriceInput").value,


price:
document.getElementById("price").value,


place:
document.getElementById("place").value,


note:
document.getElementById("note").value



};



let books =
JSON.parse(localStorage.getItem("books")) || [];



books.push(book);



localStorage.setItem(
"books",
JSON.stringify(books)
);



showBooks();



alert("Artikel gespeichert!");



}



showBooks();



alert("Buch gespeichert!");



}





function showBooks(){


let books =
JSON.parse(localStorage.getItem("books")) || [];



let html="";



books.forEach((b,index)=>{


let gewinn = 0;


if(b.buyPrice && b.price){

gewinn =
parseFloat(b.price.replace(",", ".")) -
parseFloat(b.buyPrice.replace(",", "."));

}



html += `

<div class="book">

<h3>📦 ${b.title}</h3>

Autor: ${b.author || "-"}<br>

⭐ Zustand: ${b.condition}<br>

💰 Einkauf: ${b.buyPrice || "-"} €<br>

🏷 Verkauf: ${b.price || "-"} €<br>

📈 Gewinn: ${gewinn.toFixed(2)} €<br>

📦 Lager: ${b.place || "-"}<br>

📝 ${b.note || ""}


</div>


`;



});



document.getElementById("books").innerHTML = html;



}


showBooks();



</script>




<script>


if("serviceWorker" in navigator){

navigator.serviceWorker.register(
"service-worker.js"
);

}


</script>



</body>

</html>
